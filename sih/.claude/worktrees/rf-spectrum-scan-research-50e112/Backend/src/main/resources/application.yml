# Intelligent RF Spectrum Scan Strategy - Backend configuration.
#
# DATABASE PROFILES. The PRD specifies PostgreSQL as the system of record, and that is what the
# `docker` profile uses. The default profile runs H2 in PostgreSQL compatibility mode instead, so
# the stack boots and the full test suite runs without Docker, Postgres or Redis installed. The
# Flyway migrations are written in SQL both engines accept, so the schema is identical either way.

spring:
  application:
    name: rf-scheduler-backend
  datasource:
    url: jdbc:h2:mem:rfscheduler;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema; JPA only checks that it matches
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

# --- application-specific -----------------------------------------------------------------------
rfscheduler:
  ml:
    # API_CONTRACT.md Section 7. Overridden in the docker profile to the compose service names.
    scheduler-url: http://localhost:8500
    periodicity-url: http://localhost:8600
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
    # When the ML services are unreachable the scheduler degrades to round-robin rather than
    # failing the whole simulation. Set false to make an ML outage loud instead of silent.
    fallback-to-baseline: true
  simulation:
    max-concurrent: 5           # NFR-004
    checkpoint-every-steps: 500 # NFR-005
    worker-threads: 4
  websocket:
    spectrum-updates-per-second: 10   # API_CONTRACT.md Section 3 backpressure
    heartbeat-seconds: 15
  security:
    # MVP demo runs unauthenticated on a trusted local network (PRD Section 16, Backend Level 9).
    # Flip to true to require a bearer token on everything except /health and /ready.
    auth-enabled: false

logging:
  level:
    root: INFO
    com.rfscheduler: INFO

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://db:5432/rfscheduler
    username: ${POSTGRES_USER:rfscheduler}
    password: ${POSTGRES_PASSWORD:rfscheduler}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: redis
      port: 6379

rfscheduler:
  ml:
    scheduler-url: http://ml-scheduler:8500
    periodicity-url: http://ml-periodicity:8600
