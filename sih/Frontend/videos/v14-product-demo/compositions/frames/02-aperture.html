(function () {

  window.__timelines["02-aperture"] = tl;
  var DUR = 12;

  function q(s) { return root.querySelector(s); }
  function qa(s) { return Array.prototype.slice.call(root.querySelectorAll(s)); }

  var bgImg = q(".bg img");
  var header = q('[data-track-index="1"]');
  var ruler = q(".ruler");
  var cursor = q(".cursor");
  var typed = q(".typed");
  var caret = q(".caret");
  var badges = qa(".badge");
  var inset = q(".inset");
  var runbtn = q(".runbtn");
  var ring = q(".ring");
  var words = qa(".headline .word");
  var slotsOn = qa(".slot.on");

  gsap.set(cursor, { x: 1560, y: 820, scale: 1 });

  /* Scene 1 (0.0-3.5): plate establishes, header + ruler enter */
  tl.fromTo(bgImg, { opacity: 0 }, { opacity: 0.6, duration: 0.6, ease: "power1.out" }, 0);
  tl.fromTo(header, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.05);
  tl.fromTo(ruler, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.15);

  /* asr-keyword-glow on "2" + "16" (attack/sustain/release envelope, one linear driver) */
  var ATTACK = 0.15, RELEASE = 0.4, REST = 0.25, MAX_BLUR = 30, MAX_BOOST = 0.18;
  var TIMINGS = { "w-2": { start: 0.6, end: 1.4 }, "w-16": { start: 1.5, end: 2.3 } };
  var REST_RGB = { r: 230, g: 234, b: 245 };
  var ACTIVE_RGB = { r: 245, g: 212, b: 122 };
  function envelope(t, s, e) {
    if (t < s) return 0;
    if (t < e) return Math.min((t - s) / ATTACK, 1);
    if (t < e + RELEASE) return 1 - ((t - e) / RELEASE) * (1 - REST);
    return REST;
  }
  function chan(a, b, e) { return Math.round(a + (b - a) * e); }
  var glowDriver = { t: 0 };
  tl.to(glowDriver, {
    t: 3.5, duration: 3.5, ease: "none",
    onUpdate: function () {
      var peak = 0;
      words.forEach(function (el) {
        var timing = TIMINGS[el.dataset.word];
        if (!timing) return;
        var env = envelope(glowDriver.t, timing.start, timing.end);
        if (env > peak) peak = env;
        el.style.textShadow = "0 0 " + (MAX_BLUR * env).toFixed(1) + "px rgba(232,184,75," + (0.9 * env).toFixed(2) + ")";
        el.style.transform = "scale(" + (1 + MAX_BOOST * env).toFixed(3) + ")";
        el.style.color = "rgb(" + chan(REST_RGB.r, ACTIVE_RGB.r, env) + "," + chan(REST_RGB.g, ACTIVE_RGB.g, env) + "," + chan(REST_RGB.b, ACTIVE_RGB.b, env) + ")";
      });
      slotsOn.forEach(function (slot) {
        slot.style.boxShadow = "0 0 " + (26 * peak).toFixed(1) + "px rgba(232,184,75," + (0.85 * peak).toFixed(2) + ")";
      });
    }
  }, 0);

    v: fullText.length, duration: 2.0, ease: "power1.inOut",
    onUpdate: function () { typed.textContent = fullText.substring(0, Math.floor(typeLen.v)); }
  }, 3.8);
  tl.set(caret, { opacity: 1 }, 3.8);
  var blink = { p: 0 };
  tl.to(blink, {
    p: Math.PI * 2 * 18, duration: DUR, ease: "none",
    onUpdate: function () {

      caret.style.opacity = localT < 3.75 ? "0" : (Math.sin(blink.p) > 0 ? "1" : "0");
    }
  }, 0);

  /* Scene 3 (6.5-9.5): twin seed badges, center-outward-expansion, asymmetric 60/40 */
  badges.forEach(function (el, i) {
    tl.fromTo(el,
      { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, opacity: 0 },
      { x: Number(el.dataset.targetX), y: Number(el.dataset.targetY), scale: 1, opacity: 1, duration: 1.2, ease: "power3.out" },

  tl.fromTo(ring, { scale: 0, opacity: 0.9 }, { scale: 4.5, opacity: 0, duration: 0.7, ease: "power2.out" }, 10.48);
})();
