  var ATTACK_DUR = 0.15;
  var RELEASE = 0.4;
  var REST_LEVEL = 0.1;
  var MAX_BLUR = 32;
  var MAX_SCALE_BOOST = 0.18;
  var REST_RGB = { r: 138, g: 147, b: 173 };

  };
  function envelope(time, start, end) {
