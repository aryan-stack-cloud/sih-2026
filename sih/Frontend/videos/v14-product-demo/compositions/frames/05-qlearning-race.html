  function tagAt(time){

  tl.to(cursor, { x: 1616, y: 194, duration: 0.8, ease: "power2.inOut" }, 0.3);
  tl.to(cursor, { scale: 0.82, duration: 0.09, ease: "power2.in" }, 1.15);

  tl.to(cursor, { scale: 1, duration: 0.12, ease: "power2.out" }, 1.24);
